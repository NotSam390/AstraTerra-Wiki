<!DOCTYPE html>
<html lang="en">
<head>

    <title>AstraTerra Wiki</title>
    <link rel="stylesheet" href="assets/css/style.css">

</head>
<body>
    <header class="site-header">

        <!-- Automatically populated with your Markdown content -->
